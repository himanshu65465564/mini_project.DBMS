<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="../CSS/style.css">
</head>
<body>
  <main class="page">

    <header class="top">
      <h1>Expense Tracker</h1>
      <div class="total-box">
        <span class="total-label">Total spent</span>
        <span class="total-amount" id="totalAmount">₹0.00</span>
        <span class="total-count" id="totalCount">0 expenses</span>
      </div>
    </header>

    <p id="message" class="message" role="status"></p>

    <section class="card">
      <h2>Add an expense</h2>
      <form id="expenseForm" novalidate>
        <div class="field">
          <label for="name">Expense name</label>
          <input type="text" id="name" placeholder="e.g. Lunch at canteen" maxlength="100">
        </div>
        <div class="field">
          <label for="amount">Amount (₹)</label>
          <input type="number" id="amount" placeholder="0.00" min="0.01" step="0.01">
        </div>
        <div class="field">
          <label for="category">Category</label>
          <select id="category">
            <option value="">Choose a category</option>
            <option>Food</option>
            <option>Travel</option>
            <option>Education</option>
            <option>Shopping</option>
            <option>Other</option>
          </select>
        </div>
        <div class="field">
          <label for="date">Date</label>
          <input type="date" id="date">
        </div>
        <button type="submit" class="btn-add">Add expense</button>
      </form>
    </section>

    <section class="card">
      <h2>Saved expenses</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Name</th>
              <th>Category</th>
              <th class="num">Amount</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="expenseList"></tbody>
        </table>
      </div>
    </section>

    <footer>Expenses are saved in this browser (localStorage).</footer>
  </main>

  <script src="../JS/script.js"></script>
</body>
</html>
